<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 600" width="192" height="600">
  <defs>
    <linearGradient id="bandBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="10%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="90%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="indigoEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <pattern id="stripe" width="20" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="20" x2="20" y2="0" stroke="#334155" stroke-width="0.8" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Band Body -->
  <rect width="192" height="600" fill="url(#bandBg)"/>
  <rect width="192" height="600" fill="url(#stripe)"/>

  <!-- Left and Right Indigo Accent Borders -->
  <rect x="0" y="0" width="10" height="600" fill="url(#indigoEdge)"/>
  <rect x="182" y="0" width="10" height="600" fill="url(#indigoEdge)"/>

  <!-- Stitching lines -->
  <line x1="16" y1="0" x2="16" y2="600" stroke="#38BDF8" stroke-width="1" stroke-dasharray="8,6" stroke-opacity="0.6"/>
  <line x1="176" y1="0" x2="176" y2="600" stroke="#38BDF8" stroke-width="1" stroke-dasharray="8,6" stroke-opacity="0.6"/>

  <!-- Repeating Text Blocks along the Strap -->
  <g transform="translate(96, 0)">
    <!-- Block 1 -->
    <g transform="translate(0, 70) rotate(90)">
      <text x="0" y="5" text-anchor="middle" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" letter-spacing="2">DANILO VINÍCIUS</text>
    </g>

    <g transform="translate(0, 160)">
      <polygon points="0,-8 7,5 -7,5" fill="#38BDF8"/>
    </g>

    <g transform="translate(0, 240) rotate(90)">
      <text x="0" y="5" text-anchor="middle" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" letter-spacing="2">DATA ANALYTICS</text>
    </g>

    <g transform="translate(0, 330)">
      <circle cx="0" cy="0" r="5" fill="#6366F1"/>
    </g>

    <g transform="translate(0, 420) rotate(90)">
      <text x="0" y="5" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" letter-spacing="2">POWER BI • PYTHON</text>
    </g>

    <g transform="translate(0, 510)">
      <polygon points="0,8 7,-5 -7,-5" fill="#38BDF8"/>
    </g>
  </g>
</svg>

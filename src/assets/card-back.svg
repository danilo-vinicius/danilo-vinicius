<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="800" height="1120">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C6A46E"/>
      <stop offset="50%" stop-color="#E5C890"/>
      <stop offset="100%" stop-color="#C6A46E"/>
    </linearGradient>

    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#C6A46E" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#C6A46E" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#C6A46E"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="400" height="560" fill="url(#bgGrad)" rx="16"/>
  <rect width="400" height="560" fill="url(#grid)" rx="16"/>

  <!-- Outer Tech Border -->
  <rect x="12" y="12" width="376" height="536" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6" rx="12"/>
  <rect x="18" y="18" width="364" height="524" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="6,4" rx="10"/>

  <!-- Header Banner -->
  <g transform="translate(30, 35)">
    <circle cx="20" cy="20" r="18" fill="#1E293B" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <!-- Analytics Icon -->
    <path d="M 12 26 L 16 20 L 22 23 L 28 13" fill="none" stroke="#C6A46E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="28" cy="13" r="2" fill="#C6A46E"/>

    <text x="50" y="16" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">DATA ANALYTICS</text>
    <text x="50" y="30" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" font-weight="500" letter-spacing="2">PASSPORT & CREDENTIAL</text>
  </g>

  <!-- Top Accent Divider -->
  <line x1="30" y1="85" x2="370" y2="85" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Center Data Visualization Graphics -->
  <g transform="translate(30, 105)">
    <!-- Card Frame -->
    <rect width="340" height="190" fill="#090D16" fill-opacity="0.8" rx="10" stroke="#334155" stroke-width="1"/>
    
    <!-- Title -->
    <text x="15" y="24" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="1">LIVE METRICS & PIPELINES</text>
    <circle cx="320" cy="20" r="4" fill="#22C55E"/>

    <!-- Bar Chart -->
    <rect x="25" y="110" width="18" height="50" fill="url(#chartGrad)" rx="2"/>
    <rect x="50" y="80" width="18" height="80" fill="url(#chartGrad)" rx="2"/>
    <rect x="75" y="60" width="18" height="100" fill="url(#chartGrad)" rx="2"/>
    <rect x="100" y="95" width="18" height="65" fill="url(#chartGrad)" rx="2"/>
    <rect x="125" y="45" width="18" height="115" fill="url(#chartGrad)" rx="2"/>

    <!-- Trend Line Graph -->
    <path d="M 25 120 Q 60 70, 85 90 T 135 40 T 190 75 T 250 35 T 315 50" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Nodes on Line -->
    <circle cx="85" cy="90" r="3.5" fill="#38BDF8" stroke="#0F172A" stroke-width="1.5"/>
    <circle cx="135" cy="40" r="3.5" fill="#C6A46E" stroke="#0F172A" stroke-width="1.5"/>
    <circle cx="250" cy="35" r="3.5" fill="#818CF8" stroke="#0F172A" stroke-width="1.5"/>
    <circle cx="315" cy="50" r="3.5" fill="#C6A46E" stroke="#0F172A" stroke-width="1.5"/>

    <!-- Stat Badges Inside Graph Area -->
    <g transform="translate(160, 115)">
      <rect width="75" height="45" fill="#1E293B" rx="6" stroke="#334155" stroke-width="1"/>
      <text x="10" y="18" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8" font-weight="600">MODELS</text>
      <text x="10" y="34" fill="#C6A46E" font-family="system-ui, sans-serif" font-size="14" font-weight="700">99.8%</text>
    </g>

    <g transform="translate(245, 115)">
      <rect width="80" height="45" fill="#1E293B" rx="6" stroke="#334155" stroke-width="1"/>
      <text x="10" y="18" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8" font-weight="600">ACCURACY</text>
      <text x="10" y="34" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">+150K</text>
    </g>
  </g>

  <!-- User Info Section -->
  <g transform="translate(30, 315)">
    <!-- Avatar / Badge Icon -->
    <rect x="0" y="0" width="60" height="60" fill="#1E293B" rx="8" stroke="url(#goldGrad)" stroke-width="1"/>
    <path d="M 30 18 L 42 26 L 42 38 L 30 46 L 18 38 L 18 26 Z" fill="none" stroke="#C6A46E" stroke-width="1.5"/>
    <circle cx="30" cy="32" r="5" fill="#38BDF8"/>

    <!-- Name & Role -->
    <text x="75" y="22" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="0.5">DANILO VINÍCIUS</text>
    <text x="75" y="40" fill="#C6A46E" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">SENIOR DATA & BI ANALYST</text>
    <text x="75" y="55" fill="#64748B" font-family="system-ui, sans-serif" font-size="9" font-weight="500">BRASFORT • PRESIDÊNCIA • EBSERH</text>
  </g>

  <!-- Tech Stack Chips -->
  <g transform="translate(30, 395)">
    <rect x="0" y="0" width="70" height="24" fill="#1E293B" rx="4" stroke="#334155" stroke-width="1"/>
    <text x="35" y="16" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="9" font-weight="600">PYTHON</text>

    <rect x="78" y="0" width="75" height="24" fill="#1E293B" rx="4" stroke="#334155" stroke-width="1"/>
    <text x="115" y="16" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="9" font-weight="600">POWER BI</text>

    <rect x="161" y="0" width="55" height="24" fill="#1E293B" rx="4" stroke="#334155" stroke-width="1"/>
    <text x="188" y="16" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="9" font-weight="600">SQL</text>

    <rect x="224" y="0" width="55" height="24" fill="#1E293B" rx="4" stroke="#334155" stroke-width="1"/>
    <text x="251" y="16" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="9" font-weight="600">ETL</text>

    <rect x="287" y="0" width="53" height="24" fill="#1E293B" rx="4" stroke="#334155" stroke-width="1"/>
    <text x="313" y="16" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="9" font-weight="600">PANDAS</text>
  </g>

  <!-- Barcode / Security Footer -->
  <g transform="translate(30, 445)">
    <line x1="0" y1="0" x2="340" y2="0" stroke="#334155" stroke-width="1"/>
    
    <!-- Vector Barcode Lines -->
    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="3" height="35" fill="#CBD5E1"/>
      <rect x="5" y="0" width="1" height="35" fill="#CBD5E1"/>
      <rect x="8" y="0" width="4" height="35" fill="#CBD5E1"/>
      <rect x="15" y="0" width="2" height="35" fill="#CBD5E1"/>
      <rect x="19" y="0" width="6" height="35" fill="#CBD5E1"/>
      <rect x="28" y="0" width="1" height="35" fill="#CBD5E1"/>
      <rect x="31" y="0" width="3" height="35" fill="#CBD5E1"/>
      <rect x="36" y="0" width="5" height="35" fill="#CBD5E1"/>
      <rect x="43" y="0" width="2" height="35" fill="#CBD5E1"/>
      <rect x="47" y="0" width="1" height="35" fill="#CBD5E1"/>
      <rect x="50" y="0" width="4" height="35" fill="#CBD5E1"/>
      <rect x="56" y="0" width="2" height="35" fill="#CBD5E1"/>
      <rect x="60" y="0" width="6" height="35" fill="#CBD5E1"/>
      <rect x="68" y="0" width="1" height="35" fill="#CBD5E1"/>
      <rect x="71" y="0" width="3" height="35" fill="#CBD5E1"/>
      <rect x="76" y="0" width="5" height="35" fill="#CBD5E1"/>
      <rect x="83" y="0" width="2" height="35" fill="#CBD5E1"/>
      <rect x="87" y="0" width="4" height="35" fill="#CBD5E1"/>
      <rect x="93" y="0" width="1" height="35" fill="#CBD5E1"/>
      <rect x="96" y="0" width="3" height="35" fill="#CBD5E1"/>
      <rect x="101" y="0" width="5" height="35" fill="#CBD5E1"/>
      <rect x="108" y="0" width="2" height="35" fill="#CBD5E1"/>
      <rect x="112" y="0" width="6" height="35" fill="#CBD5E1"/>
      <rect x="120" y="0" width="1" height="35" fill="#CBD5E1"/>
      <rect x="123" y="0" width="4" height="35" fill="#CBD5E1"/>
      <rect x="129" y="0" width="2" height="35" fill="#CBD5E1"/>
      <rect x="133" y="0" width="5" height="35" fill="#CBD5E1"/>
      <rect x="140" y="0" width="1" height="35" fill="#CBD5E1"/>
      <rect x="143" y="0" width="3" height="35" fill="#CBD5E1"/>
    </g>

    <!-- Serial & Security Badge -->
    <text x="160" y="30" fill="#94A3B8" font-family="monospace" font-size="11" letter-spacing="1">AUTH-ID: DV-8465-2026</text>
    <text x="160" y="44" fill="#64748B" font-family="system-ui, sans-serif" font-size="8">SECURE DATA SCIENCE BADGE</text>
  </g>
</svg>
